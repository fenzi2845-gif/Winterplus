<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Winter+ — Заявка на сервер</title> <meta name="google-site-verification" content="31Odi7Gq5aOjKtqgB0FGE6t0HDKYcT4ruhEJ5XBLiGQ" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #131b2e;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #3b82f6;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #334155;
            cursor: not-allowed;
        }
        .alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .alert.pending {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }
        .menu-box {
            display: none;
            text-align: center;
        }
        .menu-box h3 {
            margin-bottom: 15px;
            color: #10b981;
            font-size: 22px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #1e293b;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid #334155;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background: #334155;
        }
        .menu-btn.donate {
            background: #7c3aed;
            border: none;
        }
        .menu-btn.donate:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ФОРМА ЗАЯВКИ -->
        <div id="form-container">
            <h2>Заявка на сервер Winter+</h2>
            <p class="subtitle">Заполните анкету, чтобы попасть в закрытый мир.</p>
            
            <form id="whitelist-form">
                <div class="form-group">
                    <label>Ваш игровой ник в Minecraft *</label>
                    <input type="text" id="mc_nick" required placeholder="Например: Steve">
                </div>
                
                <div class="form-group">
                    <label>Ваш никнейм в Discord *</label>
                    <input type="text" id="discord_nick" required placeholder="Например: username">
                </div>
                
                <div class="form-group">
                    <label>Ваше имя и возраст *</label>
                    <input type="text" id="age" required placeholder="Например: Максим, 14">
                </div>
                
                <div class="form-group">
                    <label>Чем планируете заниматься на сервере? *</label>
                    <textarea id="about" required placeholder="Расскажите немного о себе и планах..."></textarea>
                </div>
                
                <button type="submit" id="submit-btn">Отправить заявку</button>
            </form>
            
            <div id="alert-box" class="alert"></div>
        </div>

        <!-- МЕНЮ ИГРОКА (ПОСЛЕ ОДОБРЕНИЯ) -->
        <div id="menu-container" class="menu-box">
            <h3>✅ Заявка одобрена!</h3>
            <p style="color: #94a3b8; margin-bottom: 20px;">Добро пожаловать на проект Winter+! Вы успешно прошли проверку администратора.</p>
            
            <a href="https://discord.gg/EHSNWvZyZv" target="_blank" class="menu-btn">💬 Наш Discord сервер</a>
            <a href="#" onclick="alert('IP-адрес сервера: play.winterplus.ru (скоро запустим)')" class="menu-btn">🌐 IP-адрес сервера</a>
            <a href="#" onclick="alert('Магазин донатов находится в разработке и откроется совсем скоро!')" class="menu-btn donate">💎 Магазин привилегий (Скоро)</a>
        </div>
    </div>

    <script>
        let checkInterval = null;
        let savedIdentifier = '';

        document.getElementById('whitelist-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mc_nick = document.getElementById('mc_nick').value.trim();
            const discord_nick = document.getElementById('discord_nick').value.trim();
            const age = document.getElementById('age').value.trim();
            const about = document.getElementById('about').value.trim();
            
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mc_nick, discord_nick, age, about })
                });
                
                const result = await response.json();
                
                if (response.ok && result.status === 'success') {
                    savedIdentifier = mc_nick;
                    alertBox.className = 'alert pending';
                    alertBox.style.display = 'block';
                    alertBox.textContent = '⏳ Заявка отправлена! Ожидайте проверки администратора...';
                    submitBtn.textContent = 'Ожидание проверки...';
                    
                    // Проверяем статус каждые 4 секунды
                    checkInterval = setInterval(checkStatus, 4000);
                } else {
                    throw new Error(result.message || 'Ошибка отправки');
                }
            } catch (error) {
                alertBox.className = 'alert error';
                alertBox.style.display = 'block';
                alertBox.textContent = '❌ Не удалось соединиться с ботом. Убедитесь, что скрипт бота запущен.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить заявку';
            }
        });

        async function checkStatus() {
            if (!savedIdentifier) return;
            
            try {
                const response = await fetch('/api/check-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: savedIdentifier })
                });
                
                const data = await response.json();
                
                if (data.status === 'accepted') {
                    clearInterval(checkInterval);
                    // Скрываем форму, открываем меню
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('menu-container').style.display = 'block';
                } else if (data.status === 'rejected') {
                    clearInterval(checkInterval);
                    const alertBox = document.getElementById('alert-box');
                    alertBox.className = 'alert error';
                    alertBox.textContent = '❌ К сожалению, ваша заявка была отклонена администратором.';
                    const submitBtn = document.getElementById('submit-btn');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить заявку заново';
                }
            } catch (e) {
                console.error('Ошибка проверки статуса', e);
            }
        }
    </script>
</body>
</html>
