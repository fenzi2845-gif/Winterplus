<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winterplus — Ванильный Minecraft сервер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-discord {
            background: #5865F2;
        }
        .btn-discord:hover {
            background: #4752C4;
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }
        .btn-shop {
            background: #10b981;
        }
        .btn-shop:hover {
            background: #059669;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        /* Всплывающее уведомление о копировании IP */
        #copy-alert {
            margin-top: 15px;
            color: #34d399;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Winterplus</h1>
        <p>Добро пожаловать на лучший ванильный Minecraft сервер!</p>

        <div class="menu-buttons">
            <!-- Кнопка 1: Дискорд -->
            <a href="https://discord.gg/ваш_инвайт" target="_blank" class="btn btn-discord">
                💬 Наш Дискорд
            </a>

            <!-- Кнопка 2: IP и Версия (скрипт копирует IP в буфер обмена) -->
            <button class="btn" onclick="copyServerIP()">
                📌 IP и Версия сервера
            </button>

            <!-- Кнопка 3: Переход на сайт/магазин EasyDonate -->
            <a href="https://winterplus.easydonate.ru" target="_blank" class="btn btn-shop">
                🌐 Магазин / Донат
            </a>
        </div>

        <div id="copy-alert">✅ IP-адрес скопирован в буфер обмена: <b>winterplus.aternos.me</b> (Версия: 1.20.4)</div>
    </div>

    <script>
        function copyServerIP() {
            const ipText = "winterplus.aternos.me";
            navigator.clipboard.writeText(ipText).then(() => {
                const alertBox = document.getElementById("copy-alert");
                alertBox.style.display = "block";
                setTimeout(() => {
                    alertBox.style.display = "none";
                }, 4000);
            });
        }
    </script>

</body>
</html>
